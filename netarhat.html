    <script>

        let soundOn = true;
        let audioContext = null;
        // Custom Sound Effects Synthesizer using Web Audio API
        function playChime(chimeType) {
            if (!soundOn) return;
            try {
                if (!audioContext) {
                    audioContext = new (window.AudioContext || window.webkitAudioContext)();
                }
                const osc = audioContext.createOscillator();
                const gainNode = audioContext.createGain();
                osc.connect(gainNode);
                gainNode.connect(audioContext.destination);

                if (chimeType === 'click') {
                    osc.type = 'triangle';
                    osc.frequency.setValueAtTime(550, audioContext.currentTime);
                    gainNode.gain.setValueAtTime(0.04, audioContext.currentTime);
                    gainNode.gain.exponentialRampToValueAtTime(0.001, audioContext.currentTime + 0.1);
                    osc.start();
                    osc.stop(audioContext.currentTime + 0.1);
                } else if (chimeType === 'success') {
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(523.25, audioContext.currentTime); // C5
                    osc.frequency.setValueAtTime(659.25, audioContext.currentTime + 0.1); // E5
                    osc.frequency.setValueAtTime(783.99, audioContext.currentTime + 0.2); // G5
                    gainNode.gain.setValueAtTime(0.08, audioContext.currentTime);
                    gainNode.gain.exponentialRampToValueAtTime(0.001, audioContext.currentTime + 0.4);
                    osc.start();
                    osc.stop(audioContext.currentTime + 0.4);
                } else if (chimeType === 'alert') {
                    osc.type = 'sawtooth';
                    osc.frequency.setValueAtTime(300, audioContext.currentTime);
                    osc.frequency.setValueAtTime(250, audioContext.currentTime + 0.15);
                    gainNode.gain.setValueAtTime(0.06, audioContext.currentTime);
                    gainNode.gain.exponentialRampToValueAtTime(0.001, audioContext.currentTime + 0.3);
                    osc.start();
                    osc.stop(audioContext.currentTime + 0.3);
                }
            } catch (e) {
                console.warn("Chime block:", e);
            }
        }

        function toggleSound() {
            soundOn = !soundOn;
            const btn = document.getElementById('soundToggleBtn');
            const icon = document.getElementById('soundIcon');
            const label = btn.querySelector('span');

            if (soundOn) {
                icon.className = "fas fa-volume-up";
                btn.className = "bg-slate-800/85 hover:bg-slate-700/85 border border-slate-700 text-emerald-400 px-3 py-2 rounded-lg transition-all text-sm flex items-center gap-2";
                label.innerText = "Chimes On";
                playChime('click');
            } else {
                icon.className = "fas fa-volume-mute";
                btn.className = "bg-slate-800/85 hover:bg-slate-700/85 border border-slate-700 text-slate-400 px-3 py-2 rounded-lg transition-all text-sm flex items-center gap-2";
                label.innerText = "Chimes Off";
            }
        }

        function toggleTheme() {
            const isDark = document.documentElement.classList.contains('dark');
            const icon = document.getElementById('themeIcon');
            const text = document.getElementById('themeText');
            if (isDark) {
                document.documentElement.classList.remove('dark');
                icon.className = "fas fa-moon";
                text.innerText = "Dark Mode";
            } else {
                document.documentElement.classList.add('dark');
                icon.className = "fas fa-sun";
                text.innerText = "Light Mode";
            }
            playChime('click');
        }
    </script>
